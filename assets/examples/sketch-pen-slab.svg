<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="none" stroke="currentColor">
  <title>Ogive-nose steel projectile perforating a 178 mm concrete slab</title>
  <!-- slab, side view -->
  <rect x="180" y="50" width="52" height="180" stroke-width="1.5"/>
  <path d="M188 50 v180 M206 50 v180 M224 50 v180" stroke-width="1" opacity=".45" stroke-dasharray="4 3"/>
  <!-- projectile: shank + 3.0 CRH ogive nose -->
  <path d="M40 133 h66 q24 0 34 7 q-10 7 -34 7 h-66 z" stroke-width="1.5"/>
  <path d="M40 154 h40" stroke-width="1.5"/><path d="M74 149 l7 5 l-7 5" stroke-width="1.5"/>
  <text x="40" y="172" fill="currentColor" stroke="none">V_s 301–1058 m/s</text>
  <path d="M244 140 h40" stroke-width="1.5" stroke-dasharray="5 3"/><path d="M278 135 l7 5 l-7 5" stroke-width="1.5"/>
  <text x="246" y="158" fill="currentColor" stroke="none">V_r ?</text>
  <!-- dimensions -->
  <path d="M180 246 h52 M180 241 v10 M232 241 v10" stroke-width="1" opacity=".7"/>
  <text x="206" y="264" text-anchor="middle" fill="currentColor" stroke="none">178 mm</text>
  <path d="M166 50 v180 M161 50 h10 M161 230 h10" stroke-width="1" opacity=".7"/>
  <text x="158" y="140" text-anchor="middle" fill="currentColor" stroke="none" transform="rotate(-90 158 140)">610 mm</text>
  <text x="40" y="112" fill="currentColor" stroke="none">0.50 kg, Ø 25.4 mm</text>
  <text x="206" y="26" text-anchor="middle" fill="currentColor" stroke="none">f_c 48 MPa</text><text x="206" y="40" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">rebar mats (dashed) not modelled</text>
  <text x="160" y="288" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">not to scale</text>
</svg>
