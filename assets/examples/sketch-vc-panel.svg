<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="none" stroke="currentColor">
  <title>Reinforced concrete panel 890 x 890 x 70 mm in pure shear</title>
  <!-- panel -->
  <rect x="80" y="60" width="160" height="160" stroke-width="1.5"/>
  <!-- reinforcement grid -->
  <path d="M80 92 h160 M80 124 h160 M80 156 h160 M80 188 h160" stroke-width="1" opacity=".45"/>
  <path d="M112 60 v160 M144 60 v160 M176 60 v160 M208 60 v160" stroke-width="1" opacity=".45" stroke-dasharray="4 3"/>
  <!-- shear on the edges -->
  <path d="M90 46 h140" stroke-width="1.5"/><path d="M224 41 l7 5 l-7 5" stroke-width="1.5"/>
  <path d="M230 234 h-140" stroke-width="1.5"/><path d="M96 229 l-7 5 l7 5" stroke-width="1.5"/>
  <path d="M254 210 v-140" stroke-width="1.5"/><path d="M249 76 l5 -7 l5 7" stroke-width="1.5"/>
  <path d="M66 70 v140" stroke-width="1.5"/><path d="M61 204 l5 7 l5 -7" stroke-width="1.5"/>
  <text x="160" y="36" text-anchor="middle" fill="currentColor" stroke="none">v (increasing until failure)</text>
  <!-- labels -->
  <text x="264" y="140" fill="currentColor" stroke="none" font-size="10">ρx, fyx</text>
  <text x="96" y="254" fill="currentColor" stroke="none" font-size="10">ρy, fyy (dashed)</text>
  <path d="M80 270 h160 M80 265 v10 M240 265 v10" stroke-width="1" opacity=".7"/>
  <text x="160" y="286" text-anchor="middle" fill="currentColor" stroke="none">890 x 890 mm, t = 70 mm</text>
  <text x="160" y="140" text-anchor="middle" fill="currentColor" stroke="none" font-size="10" opacity=".8">one 50 mm shell,</text>
  <text x="160" y="153" text-anchor="middle" fill="currentColor" stroke="none" font-size="10" opacity=".8">*PART_COMPOSITE</text>
</svg>
